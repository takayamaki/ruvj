name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - name: Install gosu build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential pkg-config \
            libsdl2-dev libgl1-mesa-dev \
            libfontconfig1-dev \
            libopenal-dev libmpg123-dev \
            libopus-dev libopusfile-dev libsndfile1-dev

      - name: Install gems
        run: bundle install

      - name: Run tests
        run: |
          bundle exec ruby -Ilib -Itest \
            $(find test -name '*_test.rb' | sort)
